<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><title>Mein Gym</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px 14px 36px;background:#171717;color:#fff;font:16px -apple-system,sans-serif}h1,h2{color:#ff851b}h2{font-size:19px;margin:24px 0 10px}.muted{color:#aaa;font-size:13px}.panel,.card{background:#292929;border-radius:14px;padding:14px;margin:11px 0}.stats{display:flex;gap:9px}.stats>div{background:#292929;border-radius:12px;padding:12px;flex:1}.stats b{display:block;color:#ff851b;font-size:23px}label{display:block;color:#ccc;font-size:12px;margin:10px 0 5px}input,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #555;background:#171717;color:white;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:9px;background:#ff851b;color:#171717;font-weight:700;padding:12px;margin:5px 3px 5px 0;font-size:14px}.secondary{background:#444;color:#fff}.danger{background:#63352b;color:#fff}.tag{color:#ffae65;font-size:12px}.photo{width:100%;max-height:260px;object-fit:contain;background:#171717;border-radius:10px;margin-top:9px}.tabs{display:flex;gap:8px;margin:10px 0 16px}.tabs button{flex:1;margin:0;padding:13px 8px}.tabs button.active{background:#ff851b;color:#171717}.tabs button:not(.active){background:#444;color:#fff}.logbox{background:#171717;border:1px solid #555;border-radius:12px;padding:12px;margin-top:12px}.difficulty{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.difficulty button{margin:0;padding:12px 5px;color:#fff}.difficulty .easy{background:#287a45}.difficulty .medium{background:#a87520}.difficulty .hard{background:#a83b32}.logbox input{margin-top:5px}.metric{display:inline-block;background:#171717;padding:7px 9px;border-radius:8px;margin:4px 4px 0 0;font-size:13px}.good{color:#ffae65}
</style><body>
<h1>🏋️ MEIN GYM</h1><p class="muted">DEIN TRAINING. DEINE LETZTEN WERTE.</p>
<div class="stats"><div><b id="count">0</b><span class="muted">Geräte</span></div></div>
<h2>Meine Geräte</h2><div class="tabs"><button type="button" id="upperTab" class="active">Oberkörper</button><button type="button" id="lowerTab">Unterkörper</button></div><div id="devices"></div><h2 id="heading">＋ Neues Gerät</h2>
<section class="panel"><form id="f"><input id="id" type="hidden"><label>Körperbereich</label><select id="area" style="width:100%;padding:12px;border-radius:9px;border:1px solid #555;background:#171717;color:white;font-size:16px"><option>Oberkörper</option><option>Unterkörper</option></select><div class="row"><div><label>Gerätenummer</label><input id="num" required placeholder="01"></div><div><label>Gerätename</label><input id="name" required placeholder="Beinpresse"></div></div><div class="row"><div><label>Startgewicht (kg)</label><input id="weight" type="number" min="0" step=".5"></div><div><label>Sitzposition</label><input id="seat" placeholder="Stufe 4"></div></div><div class="row"><div><label>Standardsätze</label><input id="sets" type="number" min="1" value="3"></div><div><label>Standard-Wiederholungen</label><input id="reps" type="number" min="1" value="12"></div></div><label>Weitere Einstellungen</label><textarea id="notes" rows="2"></textarea><label>Gerätefoto aus deiner Fotomediathek</label><input id="photo" type="file" accept="image/*"><img id="preview" class="photo" hidden><button type="submit">Gerät speichern</button><button type="button" class="secondary" id="cancel" hidden>Abbrechen</button></form></section>
<h2>Datensicherung</h2><section class="panel"><p class="muted">Daten bleiben im Browser auf diesem iPhone. Bitte regelmäßig exportieren.</p><button id="export">Sicherung exportieren</button><button id="imp" class="secondary">Sicherung importieren</button><input id="backup" type="file" accept="application/json" hidden></section>
<script>
const $=x=>document.getElementById(x),K='meinGymLocalV2';let db={devices:[],history:[]},pic='',activeArea='Oberkörper';try{db=JSON.parse(localStorage.getItem(K))||db}catch(e){}
// Gerätebereiche normalisieren; vorhandene Trainingsdaten behalten.
const recoveredHistory=[{"id":"1793642485964","name":"Beinpresse liegend","weight":15,"date":"2026-11-02T18:02:05.576Z","sets":3,"reps":12},{"id":"1793642761209","name":"Beinstrecket","weight":21,"date":"2026-11-02T18:06:16.888Z","sets":3,"reps":12},{"id":"1793646076314","name":"Beinbeuger","weight":28,"date":"2026-11-02T19:01:47.090Z","sets":3,"reps":12},{"id":"1793646236542","name":"Bein Adduktion","weight":55,"date":"2026-11-02T19:04:01.890Z","sets":3,"reps":12},{"id":"1793647009613","name":"Bauchptesse seitlich","weight":5,"date":"2026-11-02T19:17:02.559Z","sets":3,"reps":12},{"id":"1793638628720","name":"Latzug","weight":30,"difficulty":"Mittel","date":"2026-11-04T14:57:21.011Z","sets":3,"reps":12},{"id":"1793638857919","name":"Rudern","weight":30,"difficulty":"Mittel","date":"2026-11-04T15:03:05.321Z","sets":3,"reps":12},{"id":"1793804695516","name":"Brustpresse","weight":24,"difficulty":"Mittel","date":"2026-11-04T15:05:15.472Z","sets":3,"reps":12},{"id":"1793805869170","name":"Trizepsdrücken","weight":40,"difficulty":"Mittel","date":"2026-11-04T15:24:54.816Z","sets":3,"reps":12},{"id":"1793638628720","name":"Latzug","weight":30,"difficulty":"Mittel","date":"2026-11-04T15:32:21.792Z","sets":3,"reps":12},{"id":"1793638628720","name":"Latzug","weight":30,"difficulty":"Mittel","date":"2026-11-04T15:32:28.692Z","sets":3,"reps":12}];
db.devices=db.devices.map(d=>({...d,area:d.area==='Unterkörper'?'Unterkörper':'Oberkörper'}));
// Falls zuvor die bereinigte Sicherung ohne Verlauf importiert wurde, die gesicherten letzten Trainingswerte wieder einsetzen.
if(!Array.isArray(db.history)) db.history=[];
if(db.history.length===0) db.history=recoveredHistory;
try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Speichern nicht möglich. Bitte Sicherung exportieren und Speicher prüfen.')} 
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Speicher voll. Bitte ein kleineres Foto verwenden.')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){$('count').textContent=db.devices.length; $('upperTab').classList.toggle('active',activeArea==='Oberkörper'); $('lowerTab').classList.toggle('active',activeArea==='Unterkörper'); const shown=db.devices.filter(d=>(d.area||'Oberkörper')===activeArea);
$('devices').innerHTML=shown.length?shown.map(d=>{let a=db.history.filter(h=>String(h.id)===String(d.id)).sort((x,y)=>new Date(x.date)-new Date(y.date)),last=a[a.length-1];return `<article class="card"><div class="tag">GERÄT ${esc(d.num)}</div><b>${esc(d.name)}</b> <span style="float:right;color:#ffae65">${esc(d.weight||'–')} kg Startgewicht</span>${d.pic?`<img class="photo" src="${d.pic}">`:''}<p class="muted">Einstellung: ${esc(d.seat||'–')} · Standard ${esc(d.sets||3)} × ${esc(d.reps||12)} Wdh.</p>${last?`<div class="logbox"><b>Letztes Training</b><p><span class="metric">${esc(last.weight)} kg</span><span class="metric">${esc(last.difficulty||'Keine Angabe')}</span></p><p class="muted">${last.date?new Date(last.date).toLocaleDateString('de-DE'):'Datum unbekannt'}</p></div>`:`<p class="muted">Noch kein Training eingetragen.</p>`}${d.notes?`<p class="muted">${esc(d.notes)}</p>`:''}<div><button onclick="showLog('${d.id}')">＋ Training eintragen</button><div id="log-${esc(d.id)}"></div><button class="secondary" onclick="editIt('${d.id}')">Bearbeiten</button><button class="danger" onclick="removeIt('${d.id}')">Löschen</button></div></article>`}).join(''):'<p class="muted">Noch keine Geräte angelegt.</p>'; }
function showLog(id){let d=db.devices.find(x=>String(x.id)===String(id)),box=$('log-'+id),prev=db.history.filter(h=>String(h.id)===String(id)).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-1)[0];if(!box)return;box.innerHTML=`<div class="logbox"><b>Training für ${esc(d.name)}</b><label>Trainingsgewicht (kg)</label><input id="logweight-${id}" type="number" min="0" step=".5" placeholder="Gewicht eintragen" value="${prev?esc(prev.weight):''}"><label>Wie schwer war das Training?</label><div class="difficulty"><button type="button" class="easy" onclick="saveTraining('${id}','Leicht')">Leicht</button><button type="button" class="medium" onclick="saveTraining('${id}','Mittel')">Mittel</button><button type="button" class="hard" onclick="saveTraining('${id}','Schwer')">Schwer</button></div><button type="button" class="secondary" onclick="closeLog('${id}')">Abbrechen</button></div>`;box.scrollIntoView({behavior:'smooth',block:'nearest'})}
function closeLog(id){$('log-'+id).innerHTML=''}
function saveTraining(id,difficulty){let d=db.devices.find(x=>String(x.id)===String(id)),field=$('logweight-'+id),w=field?.value;if(w===undefined||w.trim()===''||!Number.isFinite(Number(w))||Number(w)<0){alert('Bitte zuerst dein Trainingsgewicht eintragen.');return}db.history.push({...d,weight:Number(w),sets:Number(d.sets)||3,reps:Number(d.reps)||12,difficulty,date:new Date().toISOString()});save();render();alert('Training gespeichert!')}
$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>1800000){alert('Foto bitte unter 1,8 MB wählen.');e.target.value='';return}let r=new FileReader();r.onload=()=>{pic=r.result;$('preview').src=pic;$('preview').hidden=false};r.readAsDataURL(f)};
$('f').onsubmit=e=>{e.preventDefault();let id=$('id').value||String(Date.now()),old=db.devices.find(x=>x.id===id),d={id,area:$('area').value,num:$('num').value.trim(),name:$('name').value.trim(),weight:$('weight').value,seat:$('seat').value,sets:$('sets').value,reps:$('reps').value,notes:$('notes').value,pic:pic||old?.pic||''},i=db.devices.findIndex(x=>x.id===id);if(i<0)db.devices.push(d);else db.devices[i]=d;save();$('f').reset();$('id').value='';$('sets').value=3;$('reps').value=12;$('area').value=activeArea;$('preview').hidden=true;pic='';$('cancel').hidden=true;$('heading').textContent='＋ Neues Gerät';render()};
window.editIt=id=>{let d=db.devices.find(x=>x.id===id);['num','name','weight','seat','sets','reps','notes'].forEach(k=>$(k).value=d[k]||'');$('area').value=d.area||'Oberkörper';activeArea=$('area').value;render();$('id').value=id;pic='';$('preview').hidden=!d.pic;if(d.pic)$('preview').src=d.pic;$('cancel').hidden=false;$('heading').textContent='Gerät bearbeiten';$('heading').scrollIntoView({behavior:'smooth'})};
window.removeIt=id=>{if(confirm('Gerät löschen? Das Gerät wird endgültig gelöscht.')){db.devices=db.devices.filter(x=>x.id!==id);save();render()}};
$('upperTab').onclick=()=>{activeArea='Oberkörper';render()};$('lowerTab').onclick=()=>{activeArea='Unterkörper';render()};
$('cancel').onclick=()=>{$('f').reset();$('area').value=activeArea;$('id').value='';$('preview').hidden=true;pic='';$('cancel').hidden=true;$('heading').textContent='＋ Neues Gerät'};
$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.href=u;a.download='mein-gym-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('imp').onclick=()=>$('backup').click();$('backup').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.devices)||!Array.isArray(v.history))throw 0;if(confirm('Aktuelle Daten durch Sicherung ersetzen?')){db={devices:v.devices.map(d=>({...d,area:d.area==='Unterkörper'?'Unterkörper':'Oberkörper'})),history:Array.isArray(v.history)?v.history:[]};if(db.history.length===0)db.history=recoveredHistory;save();render()}}catch(x){alert('Sicherung nicht lesbar')}};r.readAsText(f)};render();
</script></body></html>
