<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><title>Mein Gym</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px 14px 36px;background:#171717;color:#fff;font:16px -apple-system,sans-serif}h1,h2{color:#ff851b}h2{font-size:19px;margin:24px 0 10px}.muted{color:#aaa;font-size:13px}.panel,.card{background:#292929;border-radius:14px;padding:14px;margin:11px 0}.stats{display:flex;gap:9px}.stats>div{background:#292929;border-radius:12px;padding:12px;flex:1}.stats b{display:block;color:#ff851b;font-size:23px}label{display:block;color:#ccc;font-size:12px;margin:10px 0 5px}input,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #555;background:#171717;color:white;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:9px;background:#ff851b;color:#171717;font-weight:700;padding:12px;margin:5px 3px 5px 0;font-size:14px}.secondary{background:#444;color:#fff}.danger{background:#63352b;color:#fff}.tag{color:#ffae65;font-size:12px}.photo{width:100%;max-height:190px;object-fit:cover;border-radius:10px;margin-top:9px}.item{border-bottom:1px solid #555;padding:10px 0}.metric{display:inline-block;background:#171717;padding:7px 9px;border-radius:8px;margin:4px 4px 0 0;font-size:13px}.good{color:#ffae65}
</style><body>
<h1>🏋️ MEIN GYM</h1><p class="muted">DEIN TRAINING. DEIN FORTSCHRITT.</p>
<div class="stats"><div><b id="count">0</b><span class="muted">Geräte</span></div></div>
<h2>Meine Geräte</h2><div id="devices"></div><h2 id="heading">＋ Neues Gerät</h2>
<section class="panel"><form id="f"><input id="id" type="hidden"><div class="row"><div><label>Gerätenummer</label><input id="num" required placeholder="01"></div><div><label>Gerätename</label><input id="name" required placeholder="Beinpresse"></div></div><div class="row"><div><label>Startgewicht (kg)</label><input id="weight" type="number" min="0" step=".5"></div><div><label>Sitzposition</label><input id="seat" placeholder="Stufe 4"></div></div><div class="row"><div><label>Standardsätze</label><input id="sets" type="number" min="1" value="3"></div><div><label>Standard-Wiederholungen</label><input id="reps" type="number" min="1" value="12"></div></div><label>Weitere Einstellungen</label><textarea id="notes" rows="2"></textarea><label>Gerätefoto aus deiner Fotomediathek</label><input id="photo" type="file" accept="image/*"><img id="preview" class="photo" hidden><button type="submit">Gerät speichern</button><button type="button" class="secondary" id="cancel" hidden>Abbrechen</button></form></section>
<h2>Datensicherung</h2><section class="panel"><p class="muted">Daten bleiben im Browser auf diesem iPhone. Bitte regelmäßig exportieren.</p><button id="export">Sicherung exportieren</button><button id="imp" class="secondary">Sicherung importieren</button><input id="backup" type="file" accept="application/json" hidden></section>
<script>
const $=x=>document.getElementById(x),K='meinGymLocalV2';let db={devices:[],history:[]},pic='';try{db=JSON.parse(localStorage.getItem(K))||db}catch(e){}
// Alte Trainingsdaten endgültig entfernen, Geräte und Fotos behalten.
db.history=[];try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Speichern nicht möglich. Bitte Sicherung exportieren und Speicher prüfen.')} 
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Speicher voll. Bitte ein kleineres Foto verwenden.')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){$('count').textContent=db.devices.length;
$('devices').innerHTML=db.devices.length?db.devices.map(d=>{return `<article class="card"><div class="tag">GERÄT ${esc(d.num)}</div><b>${esc(d.name)}</b> <span style="float:right;color:#ffae65">${esc(d.weight||'–')} kg Startgewicht</span>${d.pic?`<img class="photo" src="${d.pic}">`:''}<p class="muted">Einstellung: ${esc(d.seat||'–')} · Standard ${esc(d.sets||3)} × ${esc(d.reps||12)} Wdh.</p>${d.notes?`<p class="muted">${esc(d.notes)}</p>`:''}<div><button class="secondary" onclick="editIt('${d.id}')">Bearbeiten</button><button class="danger" onclick="removeIt('${d.id}')">Löschen</button></div></article>`}).join(''):'<p class="muted">Noch keine Geräte angelegt.</p>'; }
$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>1800000){alert('Foto bitte unter 1,8 MB wählen.');e.target.value='';return}let r=new FileReader();r.onload=()=>{pic=r.result;$('preview').src=pic;$('preview').hidden=false};r.readAsDataURL(f)};
$('f').onsubmit=e=>{e.preventDefault();let id=$('id').value||String(Date.now()),old=db.devices.find(x=>x.id===id),d={id,num:$('num').value.trim(),name:$('name').value.trim(),weight:$('weight').value,seat:$('seat').value,sets:$('sets').value,reps:$('reps').value,notes:$('notes').value,pic:pic||old?.pic||''},i=db.devices.findIndex(x=>x.id===id);if(i<0)db.devices.push(d);else db.devices[i]=d;save();$('f').reset();$('id').value='';$('sets').value=3;$('reps').value=12;$('preview').hidden=true;pic='';$('cancel').hidden=true;$('heading').textContent='＋ Neues Gerät';render()};
window.editIt=id=>{let d=db.devices.find(x=>x.id===id);['num','name','weight','seat','sets','reps','notes'].forEach(k=>$(k).value=d[k]||'');$('id').value=id;pic='';$('preview').hidden=!d.pic;if(d.pic)$('preview').src=d.pic;$('cancel').hidden=false;$('heading').textContent='Gerät bearbeiten';$('heading').scrollIntoView({behavior:'smooth'})};
window.removeIt=id=>{if(confirm('Gerät löschen? Das Gerät wird endgültig gelöscht.')){db.devices=db.devices.filter(x=>x.id!==id);save();render()}};
$('cancel').onclick=()=>{$('f').reset();$('id').value='';$('preview').hidden=true;pic='';$('cancel').hidden=true;$('heading').textContent='＋ Neues Gerät'};
$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.href=u;a.download='mein-gym-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('imp').onclick=()=>$('backup').click();$('backup').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.devices)||!Array.isArray(v.history))throw 0;if(confirm('Aktuelle Daten durch Sicherung ersetzen?')){db={devices:v.devices,history:[]};save();render()}}catch(x){alert('Sicherung nicht lesbar')}};r.readAsText(f)};render();
</script></body></html>
