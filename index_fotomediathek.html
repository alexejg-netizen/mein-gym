<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>Mein Gym</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#171717;color:white;font:16px -apple-system,sans-serif}h1,h2{color:#ff851b}section,article{background:#292929;border-radius:14px;padding:14px;margin:12px 0}label{display:block;color:#bbb;font-size:13px;margin:10px 0 5px}input,textarea{width:100%;padding:12px;background:#171717;color:white;border:1px solid #555;border-radius:9px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{padding:12px;border:0;border-radius:9px;background:#ff851b;color:#171717;font-weight:bold;margin:5px 3px 5px 0}.secondary{background:#444;color:white}.danger{background:#63352b;color:white}.photo{max-width:100%;max-height:180px;display:block;margin-top:8px;border-radius:9px}.muted{color:#aaa;font-size:13px}.tag{color:#ff851b;font-size:12px}
</style><body><h1>🏋️ MEIN GYM</h1><p class="muted">DEIN TRAINING. DEIN FORTSCHRITT.</p><h2>Meine Geräte</h2><div id="devices"></div><h2 id="heading">＋ Neues Gerät</h2><section><form id="f"><input id="id" type="hidden"><div class="row"><div><label>Gerätenummer</label><input id="num" required placeholder="01"></div><div><label>Gerätename</label><input id="name" required placeholder="Beinpresse"></div></div><div class="row"><div><label>Gewicht (kg)</label><input id="weight" type="number"></div><div><label>Sitzposition</label><input id="seat" placeholder="Stufe 4"></div></div><div class="row"><div><label>Sätze</label><input id="sets" type="number" value="3"></div><div><label>Wiederholungen</label><input id="reps" type="number" value="12"></div></div><label>Weitere Einstellungen</label><textarea id="notes"></textarea><label>Gerätefoto aus deiner Fotomediathek auswählen</label><input id="photo" type="file" accept="image/*"><p class="muted">Tippe auf „Datei auswählen“ und wähle „Fotomediathek“ bzw. „Fotos“.</p><img id="preview" class="photo" hidden><button type="submit">Gerät speichern</button><button type="button" class="secondary" id="cancel" hidden>Abbrechen</button></form></section><h2>Trainingsverlauf</h2><section id="history" class="muted">Noch keine Trainingseinheiten.</section><h2>Datensicherung</h2><section><p class="muted">Daten bleiben im Browser auf diesem iPhone. Bitte regelmäßig exportieren.</p><button id="export">Sicherung exportieren</button><button id="imp" class="secondary">Sicherung importieren</button><input id="backup" type="file" accept="application/json" hidden></section>
<script>
const $=x=>document.getElementById(x),K='meinGymLocalV2';let db={devices:[],history:[]},pic='';try{db=JSON.parse(localStorage.getItem(K))||db}catch(e){}function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Speicher voll. Bitte kleineres Foto wählen.')}}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(){$('devices').innerHTML=db.devices.length?db.devices.map(d=>`<article><div class="tag">GERÄT ${esc(d.num)}</div><b>${esc(d.name)}</b> · ${esc(d.weight)} kg ${d.pic?`<img class="photo" src="${d.pic}">`:''}<p class="muted">Einstellung: ${esc(d.seat)} · ${esc(d.sets)} × ${esc(d.reps)} ${esc(d.notes)}</p><button onclick="logIt('${d.id}')">Training speichern</button><button class="secondary" onclick="editIt('${d.id}')">Bearbeiten</button><button class="danger" onclick="removeIt('${d.id}')">Löschen</button></article>`).join(''):'<p class="muted">Noch keine Geräte angelegt.</p>';$('history').innerHTML=db.history.length?[...db.history].reverse().map(h=>`<p><b>${esc(h.name)}</b> · ${esc(h.weight)} kg<br><span class="muted">${new Date(h.date).toLocaleString('de-DE')} · ${esc(h.sets)} × ${esc(h.reps)}</span></p>`).join(''):'Noch keine Trainingseinheiten.'}
$('photo').onchange=e=>{let file=e.target.files[0];if(!file)return;if(file.size>1800000){alert('Foto bitte unter 1,8 MB wählen.');e.target.value='';return}let r=new FileReader();r.onload=()=>{pic=r.result;$('preview').src=pic;$('preview').hidden=false};r.readAsDataURL(file)};
$('f').onsubmit=e=>{e.preventDefault();let id=$('id').value||String(Date.now()),old=db.devices.find(x=>x.id===id),d={id,num:$('num').value,name:$('name').value,weight:$('weight').value,seat:$('seat').value,sets:$('sets').value,reps:$('reps').value,notes:$('notes').value,pic:pic||old?.pic||''},i=db.devices.findIndex(x=>x.id===id);if(i<0)db.devices.push(d);else db.devices[i]=d;save();$('f').reset();$('id').value='';$('sets').value=3;$('reps').value=12;$('preview').hidden=true;pic='';$('cancel').hidden=true;$('heading').textContent='＋ Neues Gerät';draw()};
window.editIt=id=>{let d=db.devices.find(x=>x.id===id);for(let k of ['num','name','weight','seat','sets','reps','notes'])$(k).value=d[k]||'';$('id').value=id;pic='';$('preview').hidden=!d.pic;if(d.pic)$('preview').src=d.pic;$('cancel').hidden=false;$('heading').textContent='Gerät bearbeiten'};
window.removeIt=id=>{if(confirm('Gerät löschen?')){db.devices=db.devices.filter(x=>x.id!==id);save();draw()}};window.logIt=id=>{let d=db.devices.find(x=>x.id===id);db.history.push({...d,date:new Date().toISOString()});save();draw();alert('Training gespeichert!')};$('cancel').onclick=()=>{$('f').reset();$('id').value='';$('preview').hidden=true;pic='';$('cancel').hidden=true;$('heading').textContent='＋ Neues Gerät'};
$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.href=u;a.download='mein-gym-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('imp').onclick=()=>$('backup').click();$('backup').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.devices)||!Array.isArray(v.history))throw 0;if(confirm('Daten ersetzen?')){db=v;save();draw()}}catch(x){alert('Datei nicht lesbar')}};if(e.target.files[0])r.readAsText(e.target.files[0])};draw();
</script></body></html>
